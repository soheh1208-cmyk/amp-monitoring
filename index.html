<script>
(function connectAmpLiveGpsRadar() {
  const KORLAP_LIST = [
    { id: 'Dede_Rusmana', nama: 'Dede Rusmana', area: 'UPT Bekasi & ULTG Cikarang', lat: -6.238300, lng: 106.975600 },
    { id: 'Dede_Purnama', nama: 'Dede Purnama', area: 'ULTG Karet & ULTG Mampang', lat: -6.216500, lng: 106.816800 },
    { id: 'Dadang_Darsono', nama: 'Dadang Darsono', area: 'UPT Pulogadung, ULTG Ancol & Harapan Indah', lat: -6.188600, lng: 106.912500 },
    { id: 'Rizky_Badrul Z', nama: 'Rizky Badrul Zaman', area: 'Kantor Induk Bandung & ULTG Bandung Barat', lat: -6.914744, lng: 107.609810 },
    { id: 'Irfan_AS', nama: 'Irfan Ardiatma S', area: 'UPT Cawang & ULTG Mampang', lat: -6.248600, lng: 106.873200 },
    { id: 'Yan_S', nama: 'Yan Saputra', area: 'UPT Pulogadung, ULTG Ancol & Harapan Indah', lat: -6.126400, lng: 106.835300 },
    { id: 'Yadi_S', nama: 'Yadi Supriyadi', area: 'UPT Bandung, ULTG Bandung Timur & Selatan', lat: -6.938900, lng: 107.661200 },
    { id: 'Tegar_D', 'nama': 'Tegar Dwitama', area: 'ULTG Cikarang', lat: -6.284500, lng: 107.170500 },
    { id: 'Andi_I', nama: 'Andi Ilmanto', area: 'ULTG Gandul, ULTG Petukangan & ULTG Tangsel', lat: -6.327800, lng: 106.791500 },
    { id: 'Tamam_2', nama: 'Tamam', area: 'UPT Bogor & ULTG Sukabumi', lat: -6.597147, lng: 106.806039 },
    { id: 'Haerudin_3', nama: 'Haerudin', area: 'ULTG Purwakarta', lat: -6.556900, lng: 107.446300 },
    { id: 'Iswanto_R', nama: 'Iswanto Riansyah', area: 'UPT Bogor & ULTG Sukabumi', lat: -6.922100, lng: 106.927100 },
    { id: 'Rifky_Y', nama: 'Rifkiyansyah', area: 'UPT Karawang, UPT Bogor & ULTG Sukabumi', lat: -6.322700, lng: 107.337600 }
  ];

  // Cari client Supabase yang sudah terpasang di halaman
  function getSupabase() {
    if (window.supabaseClient) return window.supabaseClient;
    if (window.sb) return window.sb;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      const url = window.SUPABASE_URL || localStorage.getItem('SUPABASE_URL') || 'https://eisyylttheemoghokyd.supabase.co';
      const key = window.SUPABASE_ANON_KEY || localStorage.getItem('SUPABASE_ANON_KEY');
      if (url && key) {
        window.supabaseClient = window.supabase.createClient(url, key);
        return window.supabaseClient;
      }
    }
    return null;
  }

  // Perbarui teks ringkasan status radar di layar jika tersedia
  function updateRadarSummary(rows) {
    const activeCount = rows.length;
    document.querySelectorAll('*').forEach((el) => {
      if (el.children.length === 0 && /GPS Real Aktif\s*\/\s*13 Korlap/i.test(el.textContent || '')) {
        el.textContent = `${activeCount} GPS Real Aktif / 13 Korlap`;
      }
    });
  }

  // Ambil data 13 korlap dari tabel amp_live_gps
  async function loadRadarData() {
    const client = getSupabase();
    if (!client) return;

    const { data, error } = await client
      .from('amp_live_gps')
      .select('*')
      .order('updated_at', { ascending: false });

    if (!error && Array.isArray(data) && data.length > 0) {
      window.AMP_LIVE_GPS_ROWS = data;
      updateRadarSummary(data);
      if (typeof window.renderKorlapRadar === 'function') {
        window.renderKorlapRadar(data);
      }
    }
  }

  // Jika user yang login adalah salah satu Korlap, kirim koordinat GPS HP secara berkala
  function watchKorlapLocation(korlap) {
    if (!navigator.geolocation) return;
    navigator.geolocation.watchPosition(
      async (pos) => {
        const client = getSupabase();
        if (!client) return;
        await client.from('amp_live_gps').upsert({
          id: korlap.id,
          nama: korlap.nama,
          area: korlap.area,
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          accuracy: Math.round(pos.coords.accuracy || 25),
          status: 'LIVE RADAR',
          is_real_gps: true,
          updated_at: new Date().toISOString()
        }, { onConflict: 'id' });
      },
      () => {},
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
    );
  }

  const savedUser = JSON.parse(localStorage.getItem('amp_user') || localStorage.getItem('currentUser') || '{}');
  const activeId = String(savedUser.id || savedUser.username || savedUser.nama || '').toLowerCase();
  const matchedKorlap = KORLAP_LIST.find((k) =>
    k.id.toLowerCase() === activeId || k.nama.toLowerCase() === activeId
  );

  if (matchedKorlap) {
    watchKorlapLocation(matchedKorlap);
  }

  loadRadarData();
  setInterval(loadRadarData, 10000);
})();
</script>
